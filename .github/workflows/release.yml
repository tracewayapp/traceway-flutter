name: Release (bump + tag)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (semver, e.g. 1.0.5 or 1.0.0-beta.1).'
        required: true
        type: string
      release_notes:
        description: 'Release notes (markdown). Used for both CHANGELOG.md entry and GitHub Release.'
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare both packages and changelogs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          printf '%s\n' "$INPUT_NOTES" > "$RUNNER_TEMP/notes.md"
          bash tool/prepare_release.sh "$INPUT_VERSION" "$RUNNER_TEMP/notes.md"

      - name: Check that both package versions are available
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for package in traceway traceway_video; do
            code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "https://pub.dev/api/packages/$package/versions/$VERSION")
            if [ "$code" != 404 ]; then
              echo "Expected an unpublished version of $package ($VERSION), registry returned HTTP $code" >&2
              exit 1
            fi
          done

      - name: Install dependencies
        run: flutter pub get

      # Infos (deprecations in a newer Flutter) are reported, not fatal.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Analyze and test the video add-on
        working-directory: packages/traceway_video
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Commit, tag, and push
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TAG="v$INPUT_VERSION"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add pubspec.yaml CHANGELOG.md lib/src/sdk_version.dart packages/traceway_video/{pubspec.yaml,CHANGELOG.md}
          git commit -m "v$INPUT_VERSION"
          git tag "$TAG"
          git push origin "HEAD:$BRANCH" "$TAG"

      - name: Trigger publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: gh workflow run publish.yml --ref "v$INPUT_VERSION"
