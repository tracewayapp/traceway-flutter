name: traceway
description: Traceway error tracking and screen recording SDK for Flutter.
version: 2.0.0-beta.1
homepage: https://tracewayapp.com
repository: https://github.com/tracewayapp/traceway-flutter

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

executables:
  upload_symbols:

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.0
  http: ^1.5.0
  dartastic_opentelemetry: 0.12.0
  dartastic_opentelemetry_api: 0.12.0
  path_provider: ^2.1.0
  flutter_quick_video_encoder: ^1.7.2
  device_info_plus: ^13.1.0
  args: ^2.4.0
  fixnum: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
